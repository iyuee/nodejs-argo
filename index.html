<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argo 神经网络协议研究室 - 节点 X01</title>
    <style>
        :root {
            --primary-color: #00f2fe;
            --bg-color: #050a14;
            --text-color: #94a3b8;
            --grid-color: rgba(0, 242, 254, 0.1);
        }
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
        }
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1; opacity: 0.5;
        }
        .container { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 60px 1fr; height: 100vh; }
        header { grid-column: 1 / -1; background: rgba(10, 20, 40, 0.8); border-bottom: 1px solid rgba(0, 242, 254, 0.3); display: flex; align-items: center; padding: 0 20px; backdrop-filter: blur(5px); }
        .logo { font-size: 1.2rem; color: var(--primary-color); font-weight: bold; letter-spacing: 2px; }
        .server-status { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
        .status-dot { height: 10px; width: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }
        nav { grid-row: 2; background: rgba(10, 20, 40, 0.5); border-right: 1px solid rgba(0, 242, 254, 0.2); padding: 20px; font-size: 0.9rem; }
        nav h3 { color: rgba(255, 255, 255, 0.7); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        nav ul { list-style: none; padding: 0; margin: 0; }
        nav li { padding: 10px 0; color: #64748b; }
        nav li.active { color: var(--primary-color); }
        main { grid-row: 2; padding: 30px; display: flex; flex-direction: column; overflow-y: auto; }
        .dashboard-header h1 { color: #fff; margin: 0 0 10px 0; font-size: 2rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 20px; }
        .card-title { font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; margin-bottom: 15px; }
        .card-value { font-size: 1.8rem; color: #fff; font-weight: bold; }
        .card-unit { font-size: 0.8rem; color: var(--text-color); margin-left: 5px; }
        #network-visualizer { flex-grow: 1; margin-top: 30px; border-radius: 8px; background: radial-gradient(circle at center, #112 0%, #000 100%); position: relative; overflow: hidden; border: 1px solid rgba(0, 242, 254, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">ARGO_NET/RESEARCH</div>
            <div class="server-status"><span class="status-dot"></span>节点 X01 - 运行正常</div>
        </header>
        <nav>
            <h3>核心矩阵</h3>
            <ul>
                <li class="active">/ 网络全景图</li>
                <li>/ 协议拓扑学</li>
                <li>/ 加密分析仪</li>
                <li>/ 量子隧道观测</li>
            </ul>
        </nav>
        <main>
            <div class="dashboard-header">
                <h1>加密协议网络监测站</h1>
                <p>实时分析基于 Argo 的新型网络隧道及其在全球节点间的动态路由。</p>
            </div>
            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-title">隧道建立状态</div>
                    <div class="card-value">V_TLS/<span id="tls-count">92</span></div>
                    <p style="font-size: 0.8rem; color: #22c55e;">数据完整性验证成功 (99.8%)</p>
                </div>
                <div class="card">
                    <div class="card-title">加密吞吐量</div>
                    <div class="card-value"><span id="throughput-value">1.2</span><span class="card-unit">TB/H</span></div>
                    <p style="font-size: 0.8rem;">主要流量：/UDP_OVER_WSS</p>
                </div>
                <div class="card">
                    <div class="card-title">当前活跃路由</div>
                    <div class="card-value"><span id="route-count">35</span><span class="card-unit">子路径</span></div>
                    <p style="font-size: 0.8rem;">平均延迟：28ms</p>
                </div>
            </div>
            <div id="network-visualizer">
                <div style="position: absolute; top: 10px; left: 10px; font-size: 0.7rem; color: rgba(255,255,255,0.3);">全球网络流量拓扑模拟 (实时)</div>
            </div>
        </main>
    </div>
    <script>
        function updateStats() {
            document.getElementById('tls-count').textContent = Math.floor(Math.random() * (99 - 85) + 85);
            document.getElementById('throughput-value').textContent = (Math.random() * (1.5 - 0.8) + 0.8).toFixed(1);
            document.getElementById('route-count').textContent = Math.floor(Math.random() * (45 - 28) + 28);
        }
        setInterval(updateStats, 2000);
    </script>
</body>
</html>
